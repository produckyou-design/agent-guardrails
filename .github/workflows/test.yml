name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: unit tests
        run: python -m unittest discover tests -v

      - name: compile gates
        run: python -m py_compile gates/*.py

      - name: guardrail integrity
        run: python gates/check_guardrail_integrity.py --base origin/main --head HEAD
